<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>漫蛙漫画 - 连续阅读</title><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e94560;--ln:#0f3460;--mut:#a8a8b3;--text:#eaeaea;--success:#4ecca3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header nav button{background:transparent;border:1px solid var(--ln);color:var(--mut);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-left:8px}
header nav button.active,header nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:1200px;margin:0 auto;padding:20px}

.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s;border:1px solid transparent}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000}.card .info{padding:8px 10px}
.card .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .meta{font-size:11px;color:var(--mut);margin-top:4px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter-bar button{padding:6px 14px;border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:20px;cursor:pointer;font-size:12px;transition:all .2s}
.filter-bar button.active,.filter-bar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#tagFilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#tagFilters button{padding:4px 10px;border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:4px;cursor:pointer;font-size:11px}
#tagFilters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail-top{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.detail-cover{width:180px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.detail-info{flex:1;min-width:200px}.detail-info h1{font-size:22px;margin-bottom:8px}
.detail-info .author{color:var(--mut);margin-bottom:8px}.detail-info .stats{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tag{background:var(--card);padding:3px 10px;border-radius:4px;font-size:11px;border:1px solid var(--ln)}
.desc{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.chapter-list{max-height:600px;overflow-y:auto}.chap-item{padding:10px 14px;border-bottom:1px solid var(--ln);cursor:pointer;display:flex;justify-content:space-between;font-size:13px;transition:background .2s}
.chap-item:hover,.chap-item.active{background:var(--card);color:var(--accent)}
.reader-top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50}
.reader-top .logo{font-size:16px;color:var(--accent);cursor:pointer}.reader-top .meta{font-size:13px;color:var(--mut);flex:1}.progress{flex:1;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
#progressBar{height:100%;background:var(--accent);width:0%;transition:width .3s}.controls button{background:transparent;border:1px solid var(--ln);color:var(--mut);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:6px}
#chapPanel{position:fixed;left:0;top:0;width:260px;height:100%;background:var(--card);border-right:1px solid var(--ln);z-index:200;transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding:16px}

#settingsPanel{position:fixed;right:0;top:0;width:260px;height:100%;background:var(--card);border-left:1px solid var(--ln);z-index:200;transform:translateX(100%);transition:transform .3s;overflow-y:auto;padding:16px}
#settingsPanel.on{transform:translateX(0)}#settingsPanel h3{font-size:14px;margin-bottom:12px;color:var(--acc)}

kbd{background:var(--card);padding:2px 6px;border-radius:3px;font-size:11px;border:1px solid var(--ln)}

// ===== 导航 =====
function navigate(view){currentView=view;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+view).classList.add('active');document.querySelectorAll('header nav button').forEach(b=>b.classList.remove('active'));document.getElementById('btn'+(view==='search'?'Search':view.charAt(0).toUpperCase()+view.slice(1))).classList.add('active');window.scrollTo(0,0);if(view==='home')renderHome();if(view==='category')renderCategory();if(view==='search')renderSearch();}

// ===== 首页 =====
function renderHome(){
  const history=JSON.parse(localStorage.getItem('manga_history')||'[]');
  const cg=document.getElementById('continueGrid');
  if(history.length===0){cg.innerHTML='<div class="empty-state"><div class="icon">📚</div>暂无阅读记录</div>'}
  else{cg.innerHTML=history.slice(0,6).map(h=>{const c=COMICS.find(x=>x.id===h.comicId);if(!c)return'';const chapInfo=c.chaps[h.chapIdx]?c.chaps[h.chapIdx].num+' · 第'+(h.page+1)+'页':'暂无章节';return`<div class="card" onclick="openDetail(${c.id})"><img src="${c.cover}" alt="${c.title}" onerror="imgFail(this)"><div class="info"><div class="title">${c.title}</div><div class="meta">${chapInfo}</div></div></div>`}).join('')}

  document.getElementById('popularGrid').innerHTML=popular.map(c=>`<div class="card" onclick="openDetail(${c.id})"><img src="${c.cover}" alt="${c.title}" onerror="imgFail(this)"><div class="info"><div class="title">${c.title}</div><div class="meta">${c.stats.views} · ${c.stats.favs}</div></div></div>`).join('');

  document.getElementById('latestGrid').innerHTML=latest.map(c=>`<div class="card" onclick="openDetail(${c.id})"><img src="${c.cover}" alt="${c.title}" onerror="imgFail(this)"><div class="info"><div class="title">${c.title}</div><div class="meta">${c.stats.views} · ${c.stats.favs}</div></div></div>`).join('');

// ===== 分类 =====
function renderCategory(){

  document.getElementById('typeFilters').innerHTML=TYPES.map((t,i)=>`<button class="${filters.type===(i===0?'all':TYPES[i-1])?'active':''}" onclick="setType('${i===0?'all':TYPES[i-1]}')">${t}</button>`).join('');
  document.getElementById('regionFilters').innerHTML=REGIONS.map((r,i)=>`<button class="${filters.region===(i===0?'all':REGIONS[i-1])?'active':''}" onclick="setRegion('${i===0?'all':REGIONS[i-1]}')">${r}</button>`).join('');

  renderCategoryResults();
}
function setGenre(t){filters.genre=t;renderCategory()}
function setType(t){filters.type=t;renderCategory()}
function setRegion(t){filters.region=t;renderCategory()}
function setStatus(t){filters.status=t;renderCategory()}
function renderCategoryResults(){
  let result=[...COMICS];
  if(filters.genre!=='all')result=result.filter(c=>c.tags.includes(filters.genre));
  if(filters.type!=='all')result=result.filter(c=>c.tags.includes(filters.type));
  if(filters.region!=='all')result=result.filter(c=>c.tags.includes(filters.region));
  if(filters.status!=='all')result=result.filter(c=>c.stats.status===filters.status);
  document.getElementById('categoryGrid').innerHTML=result.map(c=>`<div class="card" onclick="openDetail(${c.id})"><img src="${c.cover}" alt="${c.title}" onerror="imgFail(this)"><div class="info"><div class="title">${c.title}</div><div class="meta">${c.stats.views} · ${c.stats.status}</div></div></div>`).join('')||'<div class="empty-state">无匹配漫画</div>';
}

// ===== 搜索 =====
let searchTimer;function debounceSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(renderSearch,300)}
function renderSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){document.getElementById('searchGrid').innerHTML='<div class="empty-state">输入关键词搜索</div>';return}
  const r=COMICS.filter(c=>c.title.toLowerCase().includes(q)||c.author.toLowerCase().includes(q)||c.tags.some(t=>t.toLowerCase().includes(q)));
  document.getElementById('searchGrid').innerHTML=r.map(c=>`<div class="card" onclick="openDetail(${c.id})"><img src="${c.cover}" alt="${c.title}" onerror="imgFail(this)"><div class="info"><div class="title">${c.title}</div><div class="meta">${c.author}</div></div></div>`).join('')||'<div class="empty-state">无匹配结果</div>';
}

// ===== 详情 =====
function openDetail(id){
  const c=COMICS.find(x=>x.id===id);if(!c)return;currentComic=c;
  document.getElementById('detailTitle').textContent=c.title;
  document.getElementById('detailAuthor').textContent='作者: '+c.author;
  document.getElementById('detailStats').innerHTML='<span>人气: '+c.stats.views+'</span><span>收藏: '+c.stats.favs+'</span><span>状态: '+c.stats.status+'</span>';
  document.getElementById('detailTags').innerHTML=c.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  document.getElementById('detailDesc').textContent=c.desc;
  document.getElementById('chapterList').innerHTML=c.chaps.map((ch,i)=>`<div class="chap-item ${i===0?'active':''}" onclick="openChapter(${c.id},${i})">${ch.num} <span style="color:var(--mut);font-size:11px">${ch.imgs}图</span></div>`).join('');
  navigate('detail');
}

// ===== 阅读器 =====
function openChapter(comicId,chapIdx){
  const c=COMICS.find(x=>x.id===comicId);if(!c||!c.chaps[chapIdx])return;
  currentComic=c;currentChapIdx=chapIdx;
  const ch=c.chaps[chapIdx];
  document.getElementById('readerTitle').textContent=c.title;
  document.getElementById('readerMeta').textContent=ch.num+' · '+ch.imgs+'图';
  document.getElementById('chapCount').textContent=c.chapters;
  document.getElementById('chapList').innerHTML=c.chaps.map((ch2,i)=>`<a class="chap-link ${i===chapIdx?'active':''}" onclick="goChap(${comicId},${i})">${ch2.num}<span class="chapnum">${ch2.imgs}张</span></a>`).join('');
  renderReader(ch);
  navigate('reader');
  saveHistory();
}
function goChap(comicId,chapIdx){openChapter(comicId,chapIdx)}
function renderReader(ch){
  const area=document.getElementById('readArea');
  let html=`<section class="chapter" data-cid="${ch.cid}" id="ch-${ch.cid}" style="padding:0"><h2 style="padding:12px 14px;color:var(--acc);font-size:14px">${ch.num} <span style="color:var(--mut);font-size:12px">${ch.imgs}张 · ${new Date().toLocaleDateString()}</span></h2><div style="padding:0 14px 20px">`;
  for(let p=1;p<=ch.imgs;p++){
    const cdnUrl=CDN+'/en_images/202605/'+ch.cid+'/'+p+'.jpg';
    const altUrls=ALT_HOSTS.map(h=>h+'/en_images/202605/94789/'+ch.cid+'/'+p+'.jpg');
    html+=`<figure class="imgwrap loading"><img class="cimg lazy" decoding="async" loading="lazy" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="${cdnUrl}" data-alt-hosts="${altUrls.join(',')}" onerror="imgFail(this)"></figure>`;
  }
  html+='</div></section>';
  area.innerHTML=html;
  setupLazyLoad();
}

// ===== 懒加载 =====
let observer=null;
function setupLazyLoad(){
  if(observer)observer.disconnect();
  observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const img=entry.target;
        const src=img.dataset.src;
        if(src&&!img.dataset.loaded){
          // Use fetch with Referer to bypass Cloudflare
          fetch(src,{headers:{'Referer':'https://manwaxu.cc/'},signal:AbortSignal.timeout(10000)})
            .then(r=>{if(!r.ok)throw new Error('fetch failed');return r.blob()})
            .then(blob=>{img.src=URL.createObjectURL(blob);img.onload=()=>{img.classList.add('loaded');img.dataset.loaded='1'};img.onerror=()=>{imgFail(img)}})
            .catch(()=>{
              const altHosts=img.dataset.altHosts?.split(',')||[];
              const nextAlt=altHosts.find(h=>!img.src.includes(new URL(h).host));
              if(nextAlt)img.src=nextAlt;else imgFail(img);
            });
        }
        observer.unobserve(img);
      }
    });
  },{rootMargin:'200px'});
  document.querySelectorAll('#readArea .cimg.lazy').forEach(img=>observer.observe(img));
}

// ===== 图片失败 =====
function imgFail(img){
  const wrap=img?.closest('.imgwrap');
  if(wrap)wrap.style.display='none';
}

// ===== 设置 =====
function toggleChapters(){document.getElementById('chapPanel').classList.toggle('on')}
function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('on')}
function scrollChapters(dir){document.getElementById('chapList').scrollBy({top:dir*200,behavior:'smooth'})}
function setBright(v){document.documentElement.style.setProperty('--brightness',v/100);document.getElementById('brightVal').textContent=v+'%'}
function setFont(v){document.documentElement.style.setProperty('--font-size',v+'px');document.getElementById('fontVal').textContent=v+'px'}
function setTheme(t){document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t));document.body.className='theme-'+t}
function toggleZoom(){zoomEnabled=!zoomEnabled;document.getElementById('zoomVal').textContent=zoomEnabled?'开':'关'}
function addBookmark(){alert('已添加书签: '+(currentComic?currentComic.title:''))}
function goTop(){document.getElementById('readArea').scrollIntoView({behavior:'smooth'})}

// ===== 历史 =====
function saveHistory(){if(!currentComic)return;const h=JSON.parse(localStorage.getItem('manga_history')||'[]');const idx=h.findIndex(x=>x.comicId===currentComic.id);if(idx>=0)h.splice(idx,1);h.unshift({comicId:currentComic.id,chapIdx:currentChapIdx,page:0,time:Date.now()});localStorage.setItem('manga_history',JSON.stringify(h.slice(0,20)))}

// ===== 键盘 =====
document.addEventListener('keydown',e=>{
  if(currentView!=='reader')return;
  if(e.key==='ArrowRight')scrollChapters(1);
  if(e.key==='ArrowLeft')scrollChapters(-1);
  if(e.key==='f'||e.key==='F')toggleFullscreen();
  if(e.key==='='||e.key==='+')setBright(Math.min(200,parseInt(document.getElementById('brightness').value)+10));
  if(e.key==='-')setBright(Math.max(10,parseInt(document.getElementById('brightness').value)-10));
});
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}

// ===== 初始化 =====
navigate('home');
</script>
