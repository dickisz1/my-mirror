<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫蛙漫画 · 书源阅读器</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e94560;--ln:#0f3460;--mut:#a8a8b3;--text:#eaeaea;--success:#4ecca3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{font-size:20px;font-weight:700;color:var(--accent);cursor:pointer}
header nav button{background:transparent;border:1px solid var(--ln);color:var(--mut);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-left:8px}
header nav button.active,header nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:1200px;margin:0 auto;padding:20px}
.view{display:none}.view.active{display:block}
.section{margin-bottom:24px}.section h2{font-size:16px;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s;border:1px solid transparent}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;display:block}
.card .info{padding:8px 10px}
.card .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-top{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.detail-cover{width:180px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);background:#000}
.detail-info{flex:1;min-width:200px}.detail-info h1{font-size:22px;margin-bottom:8px}
.detail-info .author{color:var(--mut);margin-bottom:8px}.detail-info .stats{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-bottom:12px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tag{background:var(--card);padding:3px 10px;border-radius:4px;font-size:11px;border:1px solid var(--ln);color:var(--mut)}
.desc{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.chapter-list{max-height:600px;overflow-y:auto;border:1px solid var(--ln);border-radius:8px}
.chap-item{padding:10px 14px;border-bottom:1px solid var(--ln);cursor:pointer;display:flex;justify-content:space-between;font-size:13px;transition:background .2s}
.chap-item:last-child{border-bottom:none}
.chap-item:hover,.chap-item.active{background:var(--card);color:var(--accent)}
.reader-top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.reader-top .rt-title{font-size:14px;color:var(--accent);cursor:pointer;font-weight:700}
.reader-top .meta{font-size:13px;color:var(--mut);flex:1}
.progress{flex:1;min-width:100px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
#progressBar{height:100%;background:var(--accent);width:0%;transition:width .3s;display:block}
.controls button{background:transparent;border:1px solid var(--ln);color:var(--mut);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:6px}
#readerArea{padding:20px;max-width:800px;margin:0 auto}
.imgwrap{position:relative;width:100%;margin-bottom:8px;background:#111;border-radius:4px;overflow:hidden;min-height:120px}
.imgwrap img{width:100%;display:block;background:#111;object-fit:contain}
.imgwrap.loading{background:linear-gradient(90deg,#1a1a2e 25%,#16213e 50%,#1a1a2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
footer{text-align:center;padding:20px;color:var(--mut);font-size:11px;border-top:1px solid var(--ln);margin-top:40px;line-height:1.8}
.empty-state{text-align:center;padding:40px;color:var(--mut)}.empty-state .icon{font-size:48px;margin-bottom:12px}
.src-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid var(--ln);color:var(--mut);margin-left:6px}
#rulesPanel{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:20px;font-size:12px;display:none}
#rulesPanel.on{display:block}
#rulesPanel h3{font-size:13px;color:var(--accent);margin-bottom:10px}
#rulesPanel table{width:100%;border-collapse:collapse;font-size:11px}
#rulesPanel td,#rulesPanel th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left;color:var(--mut)}
#rulesPanel th{color:var(--text)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ff8a8a;font-size:12px}
input#searchInput{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--ln);color:var(--text);border-radius:6px;font-size:14px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar button{padding:6px 14px;border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:20px;cursor:pointer;font-size:12px}
.filter-bar button.active,.filter-bar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#loadMore{display:block;width:100%;margin-top:16px;padding:12px;background:transparent;border:1px dashed var(--ln);color:var(--mut);border-radius:8px;cursor:pointer;font-size:13px}
#loadMore:hover{border-color:var(--accent);color:var(--accent)}
</style></head><body>

<header>
  <div class="logo" onclick="navigate('home')">漫蛙漫画 <span class="src-badge" id="srcBadge">书源加载中…</span></div>
  <nav>
    <button id="btnHome" class="active" onclick="navigate('home')">首页</button>
    <button id="btnCategory" onclick="navigate('category')">分类</button>
    <button id="btnSearch" onclick="navigate('search')">搜索</button>
  </nav>
</header>

<div class="container">
  <!-- 首页 -->
  <div id="view-home" class="view active">
    <div class="section" id="continueSection">
      <h2>📖 继续阅读</h2>
      <div class="grid" id="continueGrid"><div class="empty-state"><div class="icon">📚</div>暂无阅读记录</div></div>
    </div>
    <div class="section" id="popularSection"><h2>🔥 热门推荐</h2><div class="grid" id="popularGrid"></div></div>
    <div class="section" id="latestSection"><h2>🆕 最新更新</h2><div class="grid" id="latestGrid"></div></div>
    <div class="section" id="vipSection"><h2>⭐ VIP专区</h2><div class="grid" id="vipGrid"></div></div>
    <div class="section"><h2>🌙 古风</h2><div class="grid" id="gufengGrid"></div></div>
    <div class="section"><h2>⚔ 玄幻</h2><div class="grid" id="xuanhuanGrid"></div></div>
    <div class="section"><h2>🎒 校园</h2><div class="grid" id="xiaoyuanGrid"></div></div>
  </div>

  <!-- 分类 -->
  <div id="view-category" class="view">
    <div class="filter-bar" id="catFilters"></div>
    <div class="grid" id="categoryGrid"></div>
    <button id="loadMore" onclick="loadMoreCategory()">↓ 加载更多</button>
  </div>

  <!-- 搜索 -->
  <div id="view-search" class="view">
    <div style="margin-bottom:16px"><input id="searchInput" type="text" placeholder="搜索漫画标题 / 作者 / 标签…" oninput="debounceSearch()"></div>
    <div class="grid" id="searchGrid"></div>
  </div>

  <!-- 详情 -->
  <div id="view-detail" class="view">
    <div class="detail-top">
      <img class="detail-cover" id="detailCover" alt="cover">
      <div class="detail-info">
        <h1 id="detailTitle"></h1>
        <div class="author" id="detailAuthor"></div>
        <div class="stats" id="detailStats"></div>
        <div class="tags" id="detailTags"></div>
        <div class="desc" id="detailDesc"></div>
      </div>
    </div>
    <div class="section"><h2>📑 章节列表 <span class="src-badge" id="chapBadge"></span></h2></div>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <!-- 阅读器 -->
  <div id="view-reader" class="view">
    <div class="reader-top">
      <span class="rt-title" onclick="navigate('home')">漫蛙</span>
      <span class="rt-title" id="readerTitle"></span>
      <span class="meta" id="readerMeta"></span>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="controls">
        <button onclick="toggleChapters()">📖 章节</button>
        <button onclick="prevChapter()">上一话</button>
        <button onclick="nextChapter()">下一话</button>
        <button onclick="toggleRules()">🔧 书源规则</button>
      </div>
    </div>
    <div id="rulesPanel"></div>
    <div id="readerArea"></div>
    <div style="padding:20px;text-align:center;color:var(--mut);font-size:12px">键盘: ← → 切换章节 | ↑ 顶部</div>
  </div>
</div>

<footer>
  数据来源: <span id="footSrc">manwaxu.cc</span> · 全部请求经 /api/proxy 按书源规则转发 · 仅本地记录阅读进度
</footer>

<script>
/* ============================================================
 * 一、书源规则配置（前端内联默认值）
 * 权威副本在 api/proxy.js，启动时通过 /api/source/rules 拉取覆盖。
 * 去哪里取数据、怎么取，全部由这张表决定。
 * ============================================================ */
const PROXY = '/api/proxy?p=';

const BOOK_SOURCES_DEFAULT = {
  name: '漫蛙漫画',
  version: '2.0.0',
  baseUrl: 'https://manwaxu.cc',
  referer: 'https://manwaxu.cc/',
  imageCdn: ['https://tu.mhttu.cc', 'https://mwtuwu.cc', 'https://tu.mwzu.cc', 'https://mwtusi.cc'],
  decrypt: { enabled: true, algo: 'aes-256-cbc', key: '0B6666A0-BB59-1381-B746-a0E4C9AC', keyBytes: 32, ivBytes: 16 },
  rules: {
    home:     { desc: '首页列表', path: '/api/home',                params: ['page','pageSize','type','flag'] },
    search:   { desc: '搜索',     path: '/api/search',              params: ['keyword','page','pageSize'] },
    detail:   { desc: '详情页',   path: '/api/comic/{id}',          params: [] },
    chapters: { desc: '章节列表', path: '/api/comic/{id}/chapters', params: [] },
    chapInfo: { desc: '章节信息', path: '/api/comic/chapter/info/{cid}', params: [] },
    images:   { desc: '图片列表', path: '/api/comic/image/{cid}',   params: ['page','page_size','image_source'] },
    announce: { desc: '公告',     path: '/api/announcements',       params: [] }
  },
  imageRule: { desc: '图片资源', match: '/en_images/', cdn: true, decrypt: true }
};

let BOOK_SOURCES = BOOK_SOURCES_DEFAULT;

/* 拉取权威规则表；失败则沿用内联默认值 */
async function loadRules(){
  try{
    const r = await fetch(PROXY + encodeURIComponent('/api/source/rules'), {cache:'no-store'});
    if(!r.ok) throw new Error('rules http '+r.status);
    const j = await r.json();
    if(j && j.rules){ BOOK_SOURCES = j; }
    document.getElementById('srcBadge').textContent = '书源: ' + BOOK_SOURCES.name + ' v' + BOOK_SOURCES.version + ' (proxy)';
  }catch(e){
    document.getElementById('srcBadge').textContent = '书源: ' + BOOK_SOURCES.name + ' v' + BOOK_SOURCES.version + ' (内联)';
  }
  document.getElementById('footSrc').textContent = BOOK_SOURCES.baseUrl.replace(/^https?:\/\//,'');
  renderRulesPanel();
}

/* ============================================================
 * 二、按书源规则取数据
 * ============================================================ */
function buildUrl(path, params){
  let qs = '';
  if(params){
    const parts = [];
    Object.keys(params).forEach(k=>{
      if(params[k] !== undefined && params[k] !== null) parts.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
    });
    qs = parts.join('&');
  }
  return PROXY + encodeURIComponent(path) + (qs ? '&' + qs : '');
}

async function apiGet(path, params){
  const url = buildUrl(path, params);
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status + ' @ ' + path);
  const j = await r.json();
  if(j && j.code !== undefined && j.code !== 200) throw new Error('code ' + j.code + ' ' + (j.msg||''));
  return j && j.data !== undefined ? j.data : j;
}

/** 把上游返回的图片绝对地址转成走代理的相对路径 */
function toProxyPath(u){
  if(!u) return '';
  let p = u;
  if(/^https?:\/\//i.test(u)){ try{ p = new URL(u).pathname; }catch(e){ p = u.replace(/^https?:\/\/[^/]+/,''); } }
  return PROXY + encodeURIComponent(p);
}

/* ============================================================
 * 三、状态
 * ============================================================ */
const state = {
  view:'home',
  comic:null,        // 详情
  chapters:[],       // 章节列表
  chapIdx:0,
  homeType:0,        // 分类页栏目 type
  homePage:1,
  homeTotal:1
};

/* ============================================================
 * 四、导航
 * ============================================================ */
function navigate(view){
  state.view = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+view);
  if(el) el.classList.add('active');
  document.querySelectorAll('header nav button').forEach(b=>b.classList.remove('active'));
  const map = {home:'btnHome', category:'btnCategory', search:'btnSearch'};
  if(map[view]) document.getElementById(map[view]).classList.add('active');
  window.scrollTo(0,0);
  if(view==='home') renderHome();
  if(view==='category') renderCategory();
  if(view==='search') renderSearch();
}

/* ============================================================
 * 五、首页 —— 规则 home: /api/home?page=&pageSize=&type=&flag=
 * ============================================================ */
function cardHtml(item){
  const id = item.id;
  const title = esc(item.title||'');
  const pic = toProxyPath(item.pic || item.cover || '');
  const author = esc(item.author||'');
  const tags = esc((item.tags||'').split(',').slice(0,2).join(' · '));
  return `<div class="card" onclick="openDetail(${id})">
    <img src="${pic}" alt="${title}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="info"><div class="title">${title}</div><div class="meta">${tags||author}</div></div>
  </div>`;
}

async function renderHome(){
  renderHistory();
  const grids = ['popularGrid','latestGrid','vipGrid','gufengGrid','xuanhuanGrid','xiaoyuanGrid'];
  grids.forEach(g=>document.getElementById(g).innerHTML='<div class="empty-state"><span class="spinner"></span>按书源规则取数中…</div>');
  try{
    const d = await apiGet(BOOK_SOURCES.rules.home.path, {page:1, pageSize:12, type:0, flag:1});
    const pick = (k)=> (d && Array.isArray(d[k])) ? d[k] : [];
    const fill = (gid, list, meta)=>{
      const el = document.getElementById(gid);
      if(!list.length){ el.innerHTML='<div class="empty-state">暂无数据</div>'; return; }
      el.innerHTML = list.map(it=>cardHtml(it)).join('');
    };
    fill('popularGrid', pick('comicList'));
    fill('latestGrid',  pick('gufengList'));
    fill('vipGrid',     pick('vipList'));
    fill('gufengGrid',  pick('gufengList'));
    fill('xuanhuanGrid',pick('xuanhuanList'));
    fill('xiaoyuanGrid',pick('xiaoyuanList'));
  }catch(e){
    grids.forEach(g=>document.getElementById(g).innerHTML='<div class="empty-state err">取数失败: '+esc(e.message)+'</div>');
  }
}

/* ============================================================
 * 六、分类 —— 复用 home 规则的 type + page
 * ============================================================ */
const CAT_TABS = [
  {label:'全部', type:0}, {label:'热门', type:1}, {label:'VIP', type:2},
  {label:'古风', type:3}, {label:'玄幻', type:4}, {label:'校园', type:5}
];

function renderCategory(){
  document.getElementById('catFilters').innerHTML = CAT_TABS.map(t=>
    `<button class="${state.homeType===t.type?'active':''}" onclick="setCat(${t.type})">${t.label}</button>`).join('');
  state.homePage = 1;
  loadCategory(true);
}
function setCat(t){ state.homeType=t; renderCategory(); }

async function loadCategory(reset){
  const grid = document.getElementById('categoryGrid');
  if(reset) grid.innerHTML = '<div class="empty-state"><span class="spinner"></span>取数中…</div>';
  try{
    const d = await apiGet(BOOK_SOURCES.rules.home.path, {page:state.homePage, pageSize:12, type:state.homeType, flag:1});
    const list = (d && (d.comicList||d.list)) || [];
    state.homeTotal = (d && d.total) || list.length;
    const html = list.map(cardHtml).join('');
    if(reset) grid.innerHTML = html || '<div class="empty-state">无数据</div>';
    else grid.insertAdjacentHTML('beforeend', html);
    document.getElementById('loadMore').style.display =
      (state.homePage * 12 < state.homeTotal) ? 'block' : 'none';
  }catch(e){
    if(reset) grid.innerHTML = '<div class="empty-state err">取数失败: '+esc(e.message)+'</div>';
  }
}
function loadMoreCategory(){ state.homePage++; loadCategory(false); }

/* ============================================================
 * 七、搜索 —— 规则 search
 * ============================================================ */
let searchTimer;
function debounceSearch(){ clearTimeout(searchTimer); searchTimer=setTimeout(renderSearch,350); }

async function renderSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const grid = document.getElementById('searchGrid');
  if(!q){ grid.innerHTML='<div class="empty-state">输入关键词搜索</div>'; return; }
  grid.innerHTML = '<div class="empty-state"><span class="spinner"></span>搜索中…</div>';
  try{
    const d = await apiGet(BOOK_SOURCES.rules.search.path, {keyword:q, page:1, pageSize:24});
    const list = (d && d.list) || [];
    grid.innerHTML = list.length
      ? list.map(it=>cardHtml({id:it.id,title:it.title,pic:it.cover||it.pic,author:it.author,tags:it.tags})).join('')
      : '<div class="empty-state">无匹配结果</div>';
  }catch(e){
    grid.innerHTML = '<div class="empty-state err">搜索失败: '+esc(e.message)+'</div>';
  }
}

/* ============================================================
 * 八、详情 —— 规则 detail + chapters
 * ============================================================ */
async function openDetail(id){
  navigate('detail');
  document.getElementById('detailTitle').textContent = '加载中…';
  document.getElementById('chapterList').innerHTML = '<div class="empty-state"><span class="spinner"></span>按详情规则取数中…</div>';
  try{
    const info = await apiGet('/api/comic/' + id);
    state.comic = info;
    document.getElementById('detailCover').src = toProxyPath(info.cover || info.pic);
    document.getElementById('detailTitle').textContent = info.title || '';
    document.getElementById('detailAuthor').textContent = '作者: ' + (info.author || '未知');
    document.getElementById('detailStats').innerHTML =
      '<span>人气: ' + fmt(info.tHits || info.sHits || 0) + '</span>' +
      '<span>收藏: ' + fmt(info.collection || 0) + '</span>' +
      '<span>状态: ' + (info.status === 1 ? '连载中' : '完结') + '</span>';
    document.getElementById('detailTags').innerHTML =
      (info.tags||'').split(',').filter(Boolean).slice(0,20).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    document.getElementById('detailDesc').textContent = info.intro || info.description || '暂无简介';
  }catch(e){
    document.getElementById('detailTitle').textContent = '取数失败';
    document.getElementById('detailDesc').innerHTML = '<span class="err">'+esc(e.message)+'</span>';
  }
  try{
    const d = await apiGet('/api/comic/' + id + '/chapters');
    const list = (d && d.list) || [];
    state.chapters = list;
    document.getElementById('chapBadge').textContent = '规则 chapters · 共 ' + list.length + ' 话';
    document.getElementById('chapterList').innerHTML = list.length
      ? list.map((ch,i)=>`<div class="chap-item" onclick="openChapter(${i})">
            <span>${esc(ch.title||('第'+ch.sortId+'话'))}</span>
            <span style="color:var(--mut);font-size:11px">${ch.picCount||'?'}图${ch.isVip?' · VIP':''}</span>
          </div>`).join('')
      : '<div class="empty-state">无章节</div>';
  }catch(e){
    document.getElementById('chapterList').innerHTML = '<div class="empty-state err">章节取数失败: '+esc(e.message)+'</div>';
  }
}

/* ============================================================
 * 九、阅读器 —— 规则 images
 * ============================================================ */
async function openChapter(idx){
  const ch = state.chapters[idx];
  if(!ch) return;
  state.chapIdx = idx;
  navigate('reader');
  document.getElementById('readerTitle').textContent = state.comic ? state.comic.title : '';
  document.getElementById('readerMeta').textContent = (ch.title||'') + ' · ' + (ch.picCount||'?') + '图';
  const area = document.getElementById('readerArea');
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span>按图片规则取数中…</div>';
  saveHistory();

  try{
    const d = await apiGet('/api/comic/image/' + ch.id, {page:1, page_size:500, image_source:''});
    const imgs = (d && d.images) || [];
    if(!imgs.length){ area.innerHTML = '<div class="empty-state">本话无图片</div>'; return; }
    area.innerHTML = imgs.map((im,i)=>
      `<figure class="imgwrap loading" id="fig-${i}">
         <img class="cimg" data-i="${i}" alt="第${i+1}页" loading="lazy" onload="imgOk(this)" onerror="imgFail(this)">
       </figure>`).join('');
    setupLazy(imgs);
  }catch(e){
    area.innerHTML = '<div class="empty-state err">图片列表取数失败: '+esc(e.message)+'</div>';
  }
}

function prevChapter(){ if(state.chapIdx>0) openChapter(state.chapIdx-1); }
function nextChapter(){ if(state.chapIdx < state.chapters.length-1) openChapter(state.chapIdx+1); }

/** 懒加载：滑到哪张才通过代理取哪张（代理按备用 CDN 规则 + 解密） */
let observer = null;
function setupLazy(imgs){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const img = en.target;
      if(img.dataset.done) return;
      img.dataset.done = '1';
      const i = parseInt(img.dataset.i,10);
      const src = imgs[i] && imgs[i].url;
      if(!src){ imgFail(img); return; }
      img.src = toProxyPath(src);
      observer.unobserve(img);
    });
  }, {rootMargin:'300px'});
  document.querySelectorAll('#readerArea .cimg').forEach(im=>observer.observe(im));
}

function imgOk(img){
  img.dataset.loaded='1';
  const w = img.closest('.imgwrap'); if(w) w.classList.remove('loading');
}
function imgFail(img){
  const w = img.closest('.imgwrap');
  if(w){ w.classList.remove('loading'); w.classList.add('failed');
    w.innerHTML = '<div style="padding:20px;text-align:center;color:var(--mut);font-size:12px">图片加载失败</div>'; }
}

/* 阅读进度条 */
window.addEventListener('scroll', ()=>{
  if(state.view!=='reader') return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? Math.min(100, Math.round(window.scrollY / h * 100)) : 0;
  const bar = document.getElementById('progressBar');
  if(bar) bar.style.width = p + '%';
}, {passive:true});

/* ============================================================
 * 十、书源规则面板（让"规则驱动"可见）
 * ============================================================ */
function toggleRules(){
  const p = document.getElementById('rulesPanel');
  p.classList.toggle('on');
}
function renderRulesPanel(){
  const rows = Object.keys(BOOK_SOURCES.rules).map(k=>{
    const r = BOOK_SOURCES.rules[k];
    return `<tr><td><b>${k}</b></td><td>${esc(r.desc||'')}</td><td><code>${esc(r.path||'')}</code></td><td>${(r.params||[]).join(', ')||'—'}</td></tr>`;
  }).join('');
  const cdn = (BOOK_SOURCES.imageCdn||[]).map(h=>'<code>'+esc(h)+'</code>').join(' → ');
  document.getElementById('rulesPanel').innerHTML =
    `<h3>🔧 书源规则 · ${esc(BOOK_SOURCES.name)} v${esc(BOOK_SOURCES.version)}</h3>
     <div style="color:var(--mut);margin-bottom:8px">数据站点：<code>${esc(BOOK_SOURCES.baseUrl)}</code> · Referer：<code>${esc(BOOK_SOURCES.referer)}</code></div>
     <table><tr><th>动作</th><th>说明</th><th>目标路径</th><th>参数</th></tr>${rows}</table>
     <div style="color:var(--mut);margin-top:10px">图片规则：<code>${esc(BOOK_SOURCES.imageRule.match)}</code> · 备用 CDN 顺序：${cdn}</div>
     <div style="color:var(--mut);margin-top:6px">图片解密：<code>${esc(BOOK_SOURCES.decrypt.algo)}</code>（前 ${BOOK_SOURCES.decrypt.ivBytes} 字节 IV + 密文，代理端解密后下发）</div>`;
}

/* ============================================================
 * 十一、本地阅读进度
 * ============================================================ */
function saveHistory(){
  if(!state.comic) return;
  const h = JSON.parse(localStorage.getItem('manga_history')||'[]');
  const idx = h.findIndex(x=>x.comicId===state.comic.id);
  if(idx>=0) h.splice(idx,1);
  h.unshift({comicId:state.comic.id, title:state.comic.title, cover:state.comic.cover, chapIdx:state.chapIdx, time:Date.now()});
  localStorage.setItem('manga_history', JSON.stringify(h.slice(0,20)));
}
function renderHistory(){
  const h = JSON.parse(localStorage.getItem('manga_history')||'[]');
  const cg = document.getElementById('continueGrid');
  if(!h.length){ cg.innerHTML='<div class="empty-state"><div class="icon">📚</div>暂无阅读记录</div>'; return; }
  cg.innerHTML = h.slice(0,6).map(x=>`<div class="card" onclick="openDetail(${x.comicId})">
      <img src="${toProxyPath(x.cover||'')}" alt="${esc(x.title||'')}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="info"><div class="title">${esc(x.title||'')}</div><div class="meta">读到第 ${x.chapIdx+1} 话</div></div>
    </div>`).join('');
}

/* ============================================================
 * 十二、工具
 * ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ n = Number(n)||0; return n >= 10000 ? (n/10000).toFixed(1)+'万' : String(n); }
function toggleChapters(){ if(state.chapters.length) navigate('detail'); }
function goTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

document.addEventListener('keydown', e=>{
  if(state.view!=='reader') return;
  if(e.key==='ArrowRight') nextChapter();
  if(e.key==='ArrowLeft') prevChapter();
  if(e.key==='ArrowUp') goTop();
});

/* ============================================================
 * 十三、启动：先拉书源规则，再按规则取首页数据
 * ============================================================ */
(async function boot(){
  await loadRules();
  navigate('home');
})();
</script>
